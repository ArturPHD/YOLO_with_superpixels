protocol: sp11_pilot_v1
shared:
  initialization:
    # Technical lifecycle/GPU smoke only; never use this config for scarcity claims.
    mode: technical_pretrained_smoke
    base_model_path: yolo12n.pt
    base_model_sha256: null
    auxiliary_init_seed: 0
  training:
    # Set SP11_DATA_YAML to an absolute data.yaml path on each machine.
    data: "${SP11_DATA_YAML}"
    imgsz: 640
    epochs: 150
    batch: 32
    workers: 8
    device: "0"
    seed: 0
    deterministic: true
    optimizer: SGD
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    warmup_momentum: 0.8
    warmup_bias_lr: 0.1
    # Ultralytics 8.4.112 maps patience=0 to infinity: fixed-horizon, no early stop.
    patience: 0
    close_mosaic: 10
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0
    copy_paste: 0.0
    amp: true
    project: runs/sp11
  structural_supervision:
    lambda_fg: 0.05
    foreground_loss_type: balanced_bce
    scale_by_batch: true
    head_init: tiny
    purity_threshold: 0.9
    min_region_size: 4
    region_balance_policy: balanced_fg_bg
    diagnostic_gradient_norms: false
    runtime_profile: false

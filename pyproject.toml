[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-superpixels"
version = "0.1.0"
description = "Superpixel input-channel, neck-injection, and auxiliary-loss adapters for Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Artur" }]
dependencies = [
    "numpy>=1.23",
    "PyYAML>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
slic = ["scikit-image>=0.22"]
opencv = ["opencv-contrib-python>=4.8"]
ultralytics = ["ultralytics>=8.4.92"]
spit = [
    "cupy-cuda12x>=13.0.0",
    "numba>=0.59.0",
    "scipy>=1.10.1",
    "torchvision>=0.16.0",
]
coco = ["pycocotools>=2.0.8"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
